<!DOCTYPE html><html><head><style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: 'Share Tech Mono', monospace; }
canvas { position: absolute; inset: 0; }
.voile { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.92) 70%); }
.balayage { position: absolute; inset: 0; pointer-events: none; animation: scintille 5s infinite;
    background: repeating-linear-gradient(to bottom, rgba(0,255,65,0.06) 0 1px, transparent 1px 3px); }
@keyframes scintille { 0%, 100% { opacity: 0.9; } 48% { opacity: 0.55; } 50% { opacity: 1; } }
.centre { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
h1 { margin: 0; font-size: 86px; font-weight: 400; letter-spacing: 0.35em; color: #00FF41;
    text-shadow: 0 0 12px #00FF41, 0 0 45px #00FF41, 0 0 90px rgba(0,255,65,0.5); }
.slogan { margin-top: 10px; color: #E8FFE8; letter-spacing: 0.4em; font-size: 15px; opacity: 0; animation: apparait 1s 7.5s forwards; }
.demarrage { margin-top: 26px; color: #7CFC9A; font-size: 15px; min-height: 75px; }
.demarrage div { opacity: 0; animation: apparait 0.3s forwards; }
.ok { color: #00FF41; text-shadow: 0 0 8px #00FF41; }
@keyframes apparait { to { opacity: 1; } }
</style></head><body>
<canvas id="pluie"></canvas><div class="voile"></div><div class="balayage"></div>
<div class="centre">
  <h1 id="titre">CINÉMANIAK</h1>
  <div class="slogan">LE CINÉ DES FILMS CULTES · ANGERS</div>
  <div class="demarrage" id="demarrage"></div>
</div>
<script>
const toile = document.getElementById('pluie'), ctx = toile.getContext('2d');
function redimensionner() { toile.width = innerWidth; toile.height = innerHeight; }
redimensionner(); addEventListener('resize', redimensionner);
const signes = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789';
const taille = 18;
const gouttes = Array(Math.floor(innerWidth / taille)).fill(0).map(() => Math.random() * -60);
function tomber() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.07)'; ctx.fillRect(0, 0, toile.width, toile.height);
  ctx.font = taille + 'px Share Tech Mono';
  gouttes.forEach((y, i) => {
    const s = signes[Math.floor(Math.random() * signes.length)];
    ctx.fillStyle = Math.random() > 0.96 ? '#E8FFE8' : '#00FF41';
    ctx.fillText(s, i * taille, y * taille);
    gouttes[i] = (y * taille > toile.height && Math.random() > 0.975) ? 0 : y + 1;
  });
}
setInterval(tomber, 45);

const DEPART = 6500;   
const mot = 'CINÉMANIAK', titre = document.getElementById('titre');
titre.textContent = mot.split('').map(() => signes[Math.floor(Math.random() * signes.length)]).join('');
let revele = 0;
setTimeout(() => {
  const decrypte = setInterval(() => {
    titre.textContent = mot.split('').map((l, i) => i < revele ? l : signes[Math.floor(Math.random() * signes.length)]).join('');
    if (revele >= mot.length) clearInterval(decrypte);
    revele += 0.25;
  }, 60);
}, DEPART);

const lignes = [
  ['> connexion au serveur cinemaniak.angers', 'OK'],
  ['> chargement du catalogue : NB_FILMS films', 'OK'],
  ['> analyse des goûts du spectateur', 'PRÊT'],
];
lignes.forEach((l, i) => setTimeout(() => {
  const d = document.createElement('div');
  d.innerHTML = l[0] + ' ........ <span class="ok">[' + l[1] + ']</span>';
  document.getElementById('demarrage').appendChild(d);
}, DEPART + 1200 + i * 650));
</script></body></html>
